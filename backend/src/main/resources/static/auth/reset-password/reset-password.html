<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SkillScape</title>
    <link rel="stylesheet" href="../../shared/css/global.css">
    <link rel="stylesheet" href="../../shared/css/layout.css">
    <link rel="stylesheet" href="reset-password.css">
</head>
<body>
    <header id="main-header">
        <div class="container">
             <h1><a href="/landing/index.html" style="color:white; text-decoration:none;">SkillScape</a></h1>
            <nav id="main-nav">
                 <a href="/landing/index.html" class="nav-item public-link">Home</a>
                <a href="/auth/login/login.html" class="nav-item public-link">Login</a>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <div class="container">
            <h2>Reset Your Password</h2>
            <form id="reset-password-form">
                <input type="hidden" id="token" name="token"> 
                <div>
                    <label for="new-password">New Password:</label>
                    <input type="password" id="new-password" name="new-password" required>
                </div>
                <div>
                    <label for="confirm-password">Confirm New Password:</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>
                <button type="submit">Reset Password</button>
                <div id="message-area" class="message hidden"></div>
            </form>
        </div>
    </main>

    <footer id="main-footer">
        <p>© 2025 Freelancers. All rights reserved.</p>
    </footer>

    <script src="../../shared/js/config.js"></script>
    <script src="../../shared/js/utils.js"></script>
    <script src="../../shared/js/apiService.js"></script>
    <script src="../../shared/js/main.js"></script> 
    <script src="reset-password.js"></script>
</body>
</html>
