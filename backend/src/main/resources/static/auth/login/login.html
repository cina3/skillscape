<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SkillScape</title>
    <link rel="stylesheet" href="../../shared/css/global.css">
    <link rel="stylesheet" href="../../shared/css/layout.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main id="main-content">
        <div class="container">
            <h2>Login to Your Account</h2>
            <form id="login-form">
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit">Login</button>
                <div id="message-area" class="message hidden"></div> 
            </form>
            <p>Don't have an account? <a href="../register/register.html">Register here</a>.</p>
            <p><a href="../forgot-password/forgot-password.html">Forgot your password?</a></p>
        </div>
        <div id="message-area" class="message hidden"></div>
    </main>

    <footer id="main-footer">
        <p>© 2025 Freelancers. All rights reserved.</p>
    </footer>

    <script src="../../shared/js/config.js"></script>
    <script src="../../shared/js/utils.js"></script>
    <script src="../../shared/js/apiService.js"></script>
    <script src="../../shared/js/authService.js"></script>
    <script src="../../shared/js/main.js"></script>
    <script src="login.js"></script>
</body>
</html>
