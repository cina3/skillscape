<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SkillScape</title>
    <link rel="stylesheet" href="../../shared/css/global.css">
    <link rel="stylesheet" href="../../shared/css/layout.css">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <header id="main-header">
        <div class="container">
             <h1><a href="/landing/index.html" style="color:white; text-decoration:none;">SkillScape</a></h1>
            <nav id="main-nav">
                 <a href="/landing/index.html" class="nav-item public-link">Home</a>
                <a href="/auth/login/login.html" class="nav-item public-link">Login</a>
                <a href="/auth/register/register.html" class="nav-item public-link">Register</a>
                <a href="#" id="freelancer-dashboard-link" class="nav-item freelancer-link hidden">Freelancer Dashboard</a>
                <a href="#" id="customer-dashboard-link" class="nav-item customer-link hidden">Customer Dashboard</a>
                <a href="/auth/change-password/change-password.html" id="change-password-link" class="nav-item user-link hidden">Change Password</a>
                <a href="#" id="logout-button" class="nav-item user-link hidden">Logout</a>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <div class="container">
            <h2>Create Your SkillScape Account</h2>
            <form id="register-form">
                <div>
                    <label for="display-name">Display Name:</label>
                    <input type="text" id="display-name" name="displayName" required>
                </div>
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div>
                    <label for="confirm-password">Confirm Password:</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                </div>
                <button type="submit">Register</button>
                <div id="message-area" class="message hidden"></div>
            </form>
            <p>Already have an account? <a href="../login/login.html">Login here</a>.</p>
        </div>
        <div id="message-area" class="message hidden"></div>
    </main>

    <footer id="main-footer">
        <p>© 2025 Freelancers. All rights reserved.</p>
    </footer>

    <script src="../../shared/js/config.js"></script>
    <script src="../../shared/js/utils.js"></script>
    <script src="../../shared/js/apiService.js"></script>
    <script src="../../shared/js/authService.js"></script>
    <script src="../../shared/js/main.js"></script>
    <script src="register.js"></script>
</body>
</html>
