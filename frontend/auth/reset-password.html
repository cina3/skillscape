<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SkillScape</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/auth-style.css">
    <link rel="stylesheet" href="../css/component-style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-branding">
            <div class="branding-content">
                <div class="logo">
                    <svg width="50" height="60" viewBox="0 0 50 70" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M39.9245 5.2666L15.0002 27.1333L32.4245 27.1333L7.50024 49L24.9245 49L10.0002 64.5333" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1 class="brand-name">SkillScape</h1>
                <p class="tagline">Create a new<br>strong password.</p>
            </div>
            <p class="copyright">© 2025 Freelancers</p>
        </div>
        <div class="auth-form-area">
            <div class="form-wrapper">
                <h2>Set New Password</h2>
                <form id="resetPasswordForm" method="POST">
                    <input type="hidden" id="resetToken" name="token">
                    <div class="form-group">
                        <input type="password" id="new-password" name="newPassword" placeholder="New Password" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="confirm-new-password" name="confirmNewPassword" placeholder="Confirm New Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Reset Password</button>
                </form>
            </div>
        </div>
    </div>
    <script src="../design-js/component-script.js"></script>
    <script src="../js/reset-password.js"></script>
</body>
</html>
