<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Account - SkillScape</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/auth-style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-branding auth-branding-variant">
            <div class="branding-content">
                <div class="logo">
                    <svg width="50" height="60" viewBox="0 0 50 70" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M39.9245 5.2666L15.0002 27.1333L32.4245 27.1333L7.50024 49L24.9245 49L10.0002 64.5333" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h1 class="brand-name">Welcome Back,<br>Skillscaper!</h1>
            </div>
            <p class="copyright">© 2025 Freelancers</p>
        </div>
        <div class="auth-form-area">
            <div class="form-wrapper">
                <h2 class="choose-account-title">Choose Account</h2>
                <form action="#" method="POST">
                    <a href="/customer/home.html" class="btn btn-primary">Customer</a>
                    <a href="/freelancer/home.html" class="btn btn-secondary">Freelancer</a>
                </form>
            </div>
        </div>
    </div>

</html>
