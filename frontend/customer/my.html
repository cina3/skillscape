<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Listings - SkillScape</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/customer-shared-style.css">
    <link rel="stylesheet" href="../css/customer-my-style.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <div id="hamburger-menu-placeholder"></div>

    <main class="listings-container">
        <div class="listings-header">
            <h1>My Listings</h1>
        </div>

        <div class="listings-grid">
            <div class="empty-state" id="emptyState">
                <i class="fas fa-clipboard-list"></i>
                <h3>No listings found</h3>
                <p>You haven't created any listings yet. Get started by creating your first listing.</p>
                <a href="new.html" class="create-listing-btn">Create New Listing</a>
            </div>
        </div>

        <div id="listingDetailsModal" class="listing-details-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Listing Details</h2>
                    <button class="close-modal-btn">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="modal-body">
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2025 SkillScape. All rights reserved.</p>
    </footer>

    <script src="../design-js/customer-shared-script.js"></script>
    <script src="../design-js/customer-my-script.js"></script>
</body>
</html>
