<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Listings - SkillScape</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/customer-shared-style.css">
    <link rel="stylesheet" href="../css/customer-my-style.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <div id="hamburger-menu-placeholder"></div>
    
    <main class="orders-container">
        <div class="orders-header">
            <h1>My Listings</h1>
        </div>

        <div class="orders-grid">
            <div class="loading-container" style="text-align:center; padding: 60px 20px;">
                <i class="fas fa-spinner fa-spin fa-3x" style="color:#3498db; margin-bottom:20px;"></i>
                <h3>Loading your listings...</h3>
                <p>Please wait while we fetch your listings...</p>
            </div>
        </div>

        <div id="orderDetailsModal" class="order-details-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Listing Details</h2>
                    <button class="close-modal-btn"><i class="fas fa-times"></i></button>
                </div>
                
                <div class="modal-body">
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2025 SkillScape. All rights reserved.</p>
    </footer>

    <script src="../design-js/customer-shared-script.js"></script>
    <script src="../js/customer-my.js"></script>
</body>
</html>
