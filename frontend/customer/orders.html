<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - SkillScape</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/customer-shared-style.css">
    <link rel="stylesheet" href="../css/orders-style.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <div id="hamburger-menu-placeholder"></div>
    
    <main class="orders-container">
        <div class="orders-header">
            <h1>My Orders</h1>
        </div>

        <div class="orders-grid" id="ordersGrid">
        </div>

        <div id="orderDetailsModal" class="order-details-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2></h2>
                    <button class="close-modal-btn"><i class="fas fa-times"></i></button>
                </div>
                
                <div class="modal-body">
                    <div class="order-info-section">
                        <div class="info-grid">
                            <div class="info-item">
                                <span class="info-label">Status</span>
                                <span class="info-value status-indicator"></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Order Date</span>
                                <span class="info-value" id="modalOrderDate"></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Provider</span>
                                <span class="info-value" id="modalProviderName"></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Expected Delivery</span>
                                <span class="info-value" id="modalExpectedDelivery"></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Total Cost</span>
                                <span class="info-value price" id="modalTotalCost"></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">Category</span>
                                <span class="info-value" id="modalCategory"></span>
                            </div>
                        </div>
                    </div>

                    <div class="order-request-section">
                        <h3>Your Request</h3>
                        <div class="request-content">
                            <p></p>
                        </div>
                    </div>

                    <div class="order-files-section">
                        <h3>Attached Files</h3>
                        <div class="files-list">
                            <!-- Files will be populated dynamically -->
                        </div>
                    </div>

                    <div class="order-messages-section">
                        <h3>Messages</h3>
                        <div class="messages-list">
                            <!-- Messages will be populated dynamically -->
                        </div>
                    </div>

                    <div class="order-actions-section">
                        <button class="primary-action-btn">
                            <i class="fas fa-comment"></i>
                            Send Message
                        </button>
                        <button class="secondary-action-btn" id="reportIssueBtn">
                            <i class="fas fa-exclamation-triangle"></i>
                            Report Issue
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div id="ratingModal" class="action-modal">
            <div class="action-modal-content">
                <div class="action-modal-header">
                    <h3>Rate this Service</h3>
                    <button class="close-action-modal"><i class="fas fa-times"></i></button>
                </div>
                <div class="action-modal-body">
                    <div class="service-details">
                        <div class="service-image" style="background-image: url('../assets/temp.png');"></div>
                        <div class="service-info">
                            <h4></h4>
                            <p></p>
                        </div>
                    </div>
                    
                    <div class="rating-stars-input">
                        <div class="stars-label">Your Rating:</div>
                        <div class="stars-container">
                            <i class="far fa-star star-item" data-rating="1"></i>
                            <i class="far fa-star star-item" data-rating="2"></i>
                            <i class="far fa-star star-item" data-rating="3"></i>
                            <i class="far fa-star star-item" data-rating="4"></i>
                            <i class="far fa-star star-item" data-rating="5"></i>
                        </div>
                        <div class="rating-text">Select your rating</div>
                    </div>
                    
                    <div class="form-group">
                        <label for="ratingComment">Review Comments</label>
                        <textarea id="ratingComment" placeholder="Share your experience with this service..." rows="4"></textarea>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="cancel-button">Cancel</button>
                        <button class="submit-button" id="submitRating" disabled>Submit Rating</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="reportIssueModal" class="action-modal">
            <div class="action-modal-content">
                <div class="action-modal-header">
                    <h3>Report an Issue</h3>
                    <button class="close-action-modal"><i class="fas fa-times"></i></button>
                </div>
                <div class="action-modal-body">
                    <div class="service-details">
                        <div class="service-image" style="background-image: url('../assets/temp.png');"></div>
                        <div class="service-info">
                            <h4></h4>
                            <p></p>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="issueType">Issue Type</label>
                        <select id="issueType">
                            <option value="" disabled selected>Select the type of issue</option>
                            <option value="quality">Quality Issue</option>
                            <option value="communication">Communication Problem</option>
                            <option value="delivery">Late Delivery</option>
                            <option value="technical">Technical Problem</option>
                            <option value="other">Other Issue</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="issueDescription">Describe the Issue</label>
                        <textarea id="issueDescription" placeholder="Please provide details about the issue..." rows="4"></textarea>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="cancel-button">Cancel</button>
                        <button class="submit-button" id="submitIssue">Submit Report</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2025 Freelancers. All rights reserved.</p>
    </footer>

    <script src="../design-js/customer-shared-script.js"></script>
    <script src="../js/orders.js"></script>
</body>
</html>
