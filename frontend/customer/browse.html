<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse - SkillScape</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/customer-shared-style.css"> 
    <link rel="stylesheet" href="../css/browse-style.css">
</head>
<body>
    <div id="header-placeholder"></div>
    <div id="hamburger-menu-placeholder"></div>

    <main>
        <div class="browse-container">
            <div class="browse-section">
                <h1 class="browse-title">Browse</h1>
                
                <div class="browse-categories-nav">
                    <div class="category-nav-item">
                        <i class="fas fa-globe icon"></i>
                        <span>Web Design</span>
                    </div>
                    <div class="category-nav-item">
                        <i class="fas fa-cogs icon"></i>
                        <span>Engineering</span>
                    </div>
                    <div class="category-nav-item">
                        <i class="fas fa-paint-brush icon"></i>
                        <span>Art & Design</span>
                    </div>
                    <div class="category-nav-item">
                        <i class="fas fa-music icon"></i>
                        <span>Music</span>
                    </div>
                    <div class="category-nav-item">
                        <i class="fas fa-video icon"></i>
                        <span>Video Editing</span>
                    </div>
                    <div class="category-nav-item">
                        <i class="fas fa-laptop-code icon"></i>
                        <span>IT & Software</span>
                    </div>
                    <div class="category-nav-item">
                        <i class="fas fa-robot icon"></i>
                        <span>AI Services</span>
                    </div>
                    <div class="category-nav-item">
                        <i class="fas fa-bullhorn icon"></i>
                        <span>Marketing</span>
                    </div>
                    <div class="category-nav-item">
                        <i class="fas fa-chart-line icon"></i>
                        <span>Finance</span>
                    </div>
                    <div class="category-nav-item">
                        <i class="fas fa-ellipsis-h icon"></i>
                        <span>Other</span>
                    </div>
                </div>
                
                <div class="browse-toolbar">
                    <div class="filter-section">
                        <button class="filter-button">
                            <i class="fas fa-sliders-h"></i>
                            <span>View Filters</span>
                            <i class="fas fa-chevron-down"></i>
                        </button>
                    </div>
                    <div class="sort-section">
                        <span>Sort by:</span>
                        <div class="sort-dropdown">
                            <span>Recommended</span>
                            <i class="fas fa-chevron-down"></i>
                        </div>
                    </div>
                </div>
                
                <div class="listing-grid">
                </div>
                
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>© 2025 SkillScape. All rights reserved.</p>
    </footer>

    <script src="../design-js/customer-shared-script.js"></script> 
    <script src="../design-js/browse-script.js"></script> 
    <script src="../js/customer-browse.js"></script>
</body>
</html>
