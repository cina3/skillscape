<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelancer Profile - SkillScape</title>
    <link rel="stylesheet" href="../css/profile-style.css">
    <link rel="stylesheet" href="../css/customer-shared-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">

</head>
<body>
    <div id="header-placeholder"></div>
    <div id="hamburger-menu-placeholder"></div>
    
    <div class="profile-container">
        <div class="profile-banner">
            <div class="profile-header">
                <div class="profile-avatar">
                    <img src="../assets/temp.png" alt="Profile Picture">
                </div>
                <div class="profile-info">
                    <h1 class="profile-name">jane doe</h1>
                    <p class="profile-role">freelancer</p>
                </div>
                <div class="profile-actions">
                    <button class="message-btn">Message</button>
                </div>
            </div>
        </div>
        
        <div class="profile-content">
            <div class="profile-section description-section">
                <h2 class="section-title">Description</h2>
                <p class="section-content">Please DM me for more info</p>
            </div>
            
            <div class="profile-section portfolio-section">
                <h2 class="section-title">Portfolio</h2>
                <div class="portfolio-grid">
                    <div class="portfolio-item">
                        <img src="../assets/temp.png" alt="Portfolio item">
                    </div>
                    <div class="portfolio-item">
                        <img src="../assets/temp.png" alt="Portfolio item">
                    </div>
                    <div class="portfolio-item">
                        <img src="../assets/temp.png" alt="Portfolio item">
                    </div>
                    <div class="portfolio-item more-items">
                        <span>+1</span>
                    </div>
                </div>
            </div>
            
            <div class="profile-section proposals-section">
                <h2 class="section-title">Proposals</h2>
                <div class="proposals-list">
                    <div class="proposal-card">
                        <div class="proposal-info">
                            <h3 class="proposal-title">Modern Web Design</h3>
                            <span class="proposal-author">by jane doe</span>
                        </div>
                        <div class="proposal-rating">
                            <i class="fas fa-star"></i>
                            <span>4.1</span>
                        </div>
                        <div class="proposal-action">
                            <button class="view-btn">View <i class="fas fa-chevron-right"></i></button>
                        </div>
                    </div>
                    
                    <div class="proposal-card">
                        <div class="proposal-info">
                            <h3 class="proposal-title">JavaFX GUI Design</h3>
                            <span class="proposal-author">by jane doe</span>
                        </div>
                        <div class="proposal-rating">
                            <i class="fas fa-star"></i>
                            <span>3.7</span>
                        </div>
                        <div class="proposal-action">
                            <button class="view-btn">View <i class="fas fa-chevron-right"></i></button>
                        </div>
                    </div>
                    
                    <div class="proposal-card">
                        <div class="proposal-info">
                            <h3 class="proposal-title">3D Motion Editing</h3>
                            <span class="proposal-author">by jane doe</span>
                        </div>
                        <div class="proposal-rating">
                            <i class="fas fa-star"></i>
                            <span>4.6</span>
                        </div>
                        <div class="proposal-action">
                            <button class="view-btn">View <i class="fas fa-chevron-right"></i></button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="profile-section reviews-section">
                <h2 class="section-title">Reviews</h2>
                <div class="reviews-header">
                    <div class="overall-rating">
                        <i class="fas fa-star"></i>
                        <span>4.7</span>
                    </div>
                </div>
                <div class="reviews-list">
                    <div class="review-item">
                        <div class="review-content">very good</div>
                        <div class="review-rating">
                            <i class="fas fa-star"></i>
                            <span>4</span>
                        </div>
                    </div>
                    <div class="review-item">
                        <div class="review-content">perfect web designer</div>
                        <div class="review-rating">
                            <i class="fas fa-star"></i>
                            <span>5</span>
                        </div>
                    </div>
                    <div class="view-more-reviews">
                        <button class="view-more-btn">View other 26 reviews</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../design-js/freelancer-shared-script.js"></script>
    <script src="../design-js/profile-script.js"></script>
</body>
</html>
