<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Gigs – SkillScape</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/customer-shared-style.css" />
  <link rel="stylesheet" href="../css/freelancer-my-style.css" />
</head>
<body>
  <div id="header-placeholder"></div>
  <div id="hamburger-menu-placeholder"></div>

  <main class="orders-container">
    <div class="orders-header"><h1>My Gigs</h1></div>

    <div class="orders-grid"></div>

    <div id="orderDetailsModal" class="order-details-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalGigTitle">Gig Details</h2>
          <button class="close-modal-btn"><i class="fas fa-times"></i></button>
        </div>

        <div class="modal-body">
          <div class="order-info-section">
            <div class="info-grid">
              <div class="info-item">
                <span class="info-label">Listed</span>
                <span class="info-value" id="modalDateValue">—</span>
              </div>
              <div class="info-item">
                <span class="info-label">Category</span>
                <span class="info-value" id="modalCategoryValue">—</span>
              </div>
              <div class="info-item">
                <span class="info-label">Price</span>
                <span class="info-value price" id="modalPriceValue">—</span>
              </div>
              <div class="info-item">
                <span class="info-label">Pricing Type</span>
                <span class="info-value" id="modalPricingTypeValue">—</span>
              </div>
              <div class="info-item">
                <span class="info-label">Languages</span>
                <span class="info-value" id="modalLanguagesValue">—</span>
              </div>
              <div class="info-item">
                <span class="info-label">Tools & Tech</span>
                <span class="info-value" id="modalToolsValue">—</span>
              </div>
            </div>
          </div>

          <div class="order-request-section">
            <h3>Gig Description</h3>
            <div class="request-content" id="modalDescriptionContent">—</div>
          </div>
          
          <div class="what-you-get-section">
            <h3>What You Get</h3>
            <ul class="what-you-get-list" id="modalWhatYouGetList">
              <li class="what-you-get-item"><i class="fas fa-check-circle"></i> Loading features...</li>
            </ul>
          </div>

          <div class="order-files-section">
            <h3>Attached Files</h3>
            <div class="files-list" id="modalFilesList">—</div>
          </div>

          <div class="order-actions-section">
            <button class="delete-action-btn" id="modalDeleteBtn" onclick="deleteGig()">
              <i class="fas fa-trash-alt"></i> Delete Gig
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer"><p>© 2025 SkillScape. All rights reserved.</p></footer>

  <script src="../design-js/freelancer-shared-script.js"></script>
  <script src="../design-js/freelancer-my-script.js"></script>
</body>
</html>
