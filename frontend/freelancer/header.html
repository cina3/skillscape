<header class="site-header">
    <div class="header-content">
        <div class="logo">SkillScape</div>
        <div class="search-bar">
            <div class="search-container" id="skillscapeSearchComponent">
                <div class="search-input-wrapper" id="searchInputWrapper">
                    <input type="text" class="search-input" id="searchInput" placeholder="Search SkillScape...">
                    <button class="search-button" id="searchButton">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <div class="search-results-dropdown" id="searchResultsDropdown">
                    <!-- Start Static Search Result Items -->
                    <div class="search-result-item" data-category-type="categories">
                        <img src="../assets/icons/graphic-design-icon.png" alt="Graphic Design" class="category-icon">
                        <div class="result-text">
                            <span class="result-title">Graphic Design</span>
                            <span class="result-category">in Categories</span>
                        </div>
                        <div class="result-icon"><i class="fas fa-chevron-right"></i></div>
                    </div>
                    <div class="search-result-item" data-category-type="proposals">
                        <div class="result-text">
                            <span class="result-title">Urgent Logo Design Needed</span>
                            <span class="result-category">in Proposals</span>
                        </div>
                        <div class="result-icon"><i class="fas fa-chevron-right"></i></div>
                    </div>
                    <div class="search-result-item" data-category-type="categories">
                        <img src="../assets/icons/writing-icon.png" alt="Writing" class="category-icon">
                        <div class="result-text">
                            <span class="result-title">Content Writing</span>
                            <span class="result-category">in Categories</span>
                        </div>
                        <div class="result-icon"><i class="fas fa-chevron-right"></i></div>
                    </div>
                    <!-- End Static Search Result Items -->
                </div>
            </div>
        </div>
        <div class="menu-icon">
            <i class="fas fa-bars"></i>
        </div>
    </div>
</header>
