<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Component</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="search-component.css">
    <style>
        body { 
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .search-component-wrapper { 
            width: 350px;
        }
    </style>
</head>
<body>
    <div class="search-component-wrapper"> 
        <div class="search-container" id="skillscapeSearchComponent">
            <div class="search-input-wrapper" id="searchInputWrapper">
                <input type="text" class="search-input" id="searchInput" placeholder="Search SkillScape...">
                <button class="search-button" id="searchButton">
                    <i class="fas fa-search"></i>
                </button>
            </div>
            
            <div class="search-results-dropdown" id="searchResultsDropdown">
                <div class="search-result-item category-item">
                    <div class="result-text">
                        <span class="result-title">Web Design</span>
                        <span class="result-category">in Categories</span>
                    </div>
                    <div class="result-icon">
                        <img src="../assets/temp.png" alt="Web Design" class="category-icon">
                    </div>
                </div>
                
                <div class="search-result-item">
                    <div class="result-text">
                        <span class="result-title">webdesigner</span>
                        <span class="result-category">in Freelancers</span>
                    </div>
                    <div class="result-icon">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
                
                <div class="search-result-item">
                    <div class="result-text">
                        <span class="result-title">Modern Web Design</span>
                        <span class="result-category">in Proposals</span>
                    </div>
                    <div class="result-icon">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
                
                <div class="search-result-item">
                    <div class="result-text">
                        <span class="result-title">Web Security Design</span>
                        <span class="result-category">in Proposals</span>
                    </div>
                    <div class="result-icon">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
                
                <div class="search-result-item">
                    <div class="result-text">
                        <span class="result-title">webd</span>
                        <span class="result-category">in Freelancers</span>
                    </div>
                    <div class="result-icon">
                        <i class="fas fa-chevron-right"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="search-component.js"></script>
</body>
</html>
